name: Warm Build Cache

# =========================================================
# 预热「整体构建缓存」—— 与 build-ponwrt.yml 用同一套 key 口径
#
#   移植自 VIKINGYFY/OpenWRT-CI 的滚动缓存：
#     一份缓存 = staging_dir/host* + staging_dir/tool* + .ccache
#     key       = ponwrt-<源站>-<分支>-<SoC>-<上游提交号>
#     回退键   = ponwrt-<源站>-<分支>-<SoC>-
#
#   ★ 两个 workflow 都调 scripts/pwrt-cache.sh key，前缀算法只有一处，
#     所以「预热出来的」和「主流程要的」永远是同一条目录下的相邻代，
#     主流程靠 restore-keys 前缀回退必定能取到。
#     以前那种「指纹两端各算一遍，算不齐就永不命中」的坑在这里不存在。
#
#   ★ 两条通道，同一份内容：actions/cache（快、7 天会被回收）
#     + Release 备份（慢、永不过期）。主流程按 ①→② 的顺序恢复，
#     这里预热时也两条都写，保证任一时刻两边都有东西可取。
#
#   它的两个用途：
#     1) 冷启动：主流程第一次跑不必现编工具链
#     2) 保活：定时跑一次，相当于给缓存做一次 restore（刷新 lastAccessedAt），
#        避免 7 天未访问被回收
# =========================================================

on:
  workflow_dispatch:
    inputs:
      soc:
        description: 'SoC（同 SoC 下所有机型共用一份缓存）'
        required: true
        default: 'an7581'
        type: choice
        options:
          - an7581
          - an7583
          - both
      source:
        description: '编译源码仓库（需与主流程一致，否则前缀对不上）'
        required: true
        default: 'pbs05/ponwrt'
        type: choice
        options:
          - pbs05/ponwrt
          - fork
      branch:
        description: 'ponwrt 源码分支'
        required: true
        default: 'master'
      force:
        description: '忽略已有缓存，强制重编（会覆盖同一提交号那代）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      release_backup:
        description: '同时存一份到 Release 备份（与主流程同一个 release）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    # 每周一 03:17（UTC）—— 兼作缓存保活，别删
    - cron: '17 3 * * 1'

permissions:
  # 需要 contents: write 才能创建 release / 传资产；actions: write 才能 gh cache delete
  contents: write
  actions: write

env:
  BUILD_ROOT: /workdir
  CACHE_ROOT: /workdir/openwrt
  CACHE_RELEASE: cache-backup
  RELEASE_BACKUP: ${{ github.event.inputs.release_backup == 'false' && 'false' || 'true' }}
  SOURCE: ${{ github.event.inputs.source || 'pbs05/ponwrt' }}
  REPO_URL: ${{ github.event.inputs.source == 'fork' && 'https://github.com/qwe3017/ponwrt' || 'https://github.com/pbs05/ponwrt' }}
  REPO_BRANCH: ${{ github.event.inputs.branch || 'master' }}
  DIY_P1_SH: diy-part1.sh
  FORCE_REBUILD: ${{ github.event.inputs.force == 'true' && 'true' || 'false' }}
  IGNORE_CACHE: ${{ github.event.inputs.force == 'true' && 'true' || 'false' }}
  USE_CCACHE: false
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: matrix
        run: |
          case "${{ github.event.inputs.soc || 'an7581' }}" in
            both)   LIST='["an7581","an7583"]' ;;
            an7583) LIST='["an7583"]' ;;
            *)      LIST='["an7581"]' ;;
          esac
          echo "matrix={\"soc\":$LIST}" >> "$GITHUB_OUTPUT"
          echo "SoC 列表: $LIST"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
      max-parallel: 2
    env:
      SOC: ${{ matrix.soc }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # =========================================================
      # 环境初始化 —— 与主流程保持同一套依赖，避免「主流程能编、
      # 预热编不出来」这种只在一边复现的怪问题
      # =========================================================
      - name: Free disk space & init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true

          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile && sudo swapon /swapfile

          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq install build-essential clang llvm dwarves \
            libssl-dev libelf-dev bc flex bison python3 python3-distutils \
            xz-utils tar unzip zip zstd dos2unix gettext \
            rsync file wget curl git subversion 2>/dev/null || true

          # host 加速三件套：golang / rustup / BPF 用的 clang-llvm
          sudo -E apt-get -yqq install golang-go rustup \
            libclang-dev libbpf-dev lld 2>/dev/null || \
            echo "::warning::runner 工具链未装全，host 加速会部分失效（退回源码编译）"

          which rustup >/dev/null 2>&1 && {
            rustup toolchain install stable --profile minimal 2>/dev/null || true
            rustup default stable 2>/dev/null || true
          }

          if [ -x "$GITHUB_WORKSPACE/scripts/init_build_environment.sh" ]; then
            bash "$GITHUB_WORKSPACE/scripts/init_build_environment.sh" || true
          else
            sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)' || true
          fi

          sudo -E apt-get -yqq autoremove --purge
          sudo -E apt-get -yqq clean
          sudo -E timedatectl set-timezone "$TZ"

          sudo mkdir -p /workdir
          sudo chown "$USER":"$USER" /workdir
          df -hT /workdir; free -h

      - name: Clone source code
        run: |
          cd "$BUILD_ROOT"
          git clone "$REPO_URL" -b "$REPO_BRANCH" --single-branch --depth=1 openwrt
          ln -sf "$CACHE_ROOT" "$GITHUB_WORKSPACE/openwrt"
          cd openwrt
          mkdir -p .ccache
          echo "commit: $(git rev-parse --short HEAD)"

      # =========================================================
      # key / 恢复 / 恢复后处理：与主流程逐字同源
      # =========================================================
      - name: Compute cache key
        id: cache-key
        run: |
          S="$GITHUB_WORKSPACE/scripts/pwrt-cache.sh"
          [ -f "$S" ] || { echo "::error::缺 $S"; exit 1; }
          dos2unix "$S" 2>/dev/null || true
          chmod +x "$S"
          bash "$S" key "$CACHE_ROOT"

      - name: Restore build cache
        id: cache-restore
        if: env.IGNORE_CACHE != 'true'
        uses: actions/cache/restore@v5
        with:
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}-
          path: |
            ${{ env.CACHE_ROOT }}/.ccache
            ${{ env.CACHE_ROOT }}/staging_dir/host*
            ${{ env.CACHE_ROOT }}/staging_dir/tool*

      - name: Restore cache from Release backup
        id: release-restore
        if: >-
          env.IGNORE_CACHE != 'true'
          && env.RELEASE_BACKUP == 'true'
          && steps.cache-restore.outputs.cache-matched-key == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$CACHE_ROOT"
          PREFIX="${{ steps.cache-key.outputs.prefix }}"

          if ! gh release view "$CACHE_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "Release $CACHE_RELEASE 不存在（首次运行）"
            exit 0
          fi

          ASSET=$(gh release view "$CACHE_RELEASE" --repo "$GITHUB_REPOSITORY" \
                    --json assets -q '.assets[] | "\(.createdAt) \(.name)"' 2>/dev/null \
                  | grep " ${PREFIX}-" | sort -r | head -1 | awk '{print $2}')
          if [ -z "$ASSET" ]; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "Release 里没有 ${PREFIX}-* 的备份"
            exit 0
          fi

          echo "从 Release 取备份: $ASSET"
          which unzstd >/dev/null 2>&1 || sudo -E apt-get -yqq install zstd >/dev/null 2>&1 || true

          if gh release download "$CACHE_RELEASE" --repo "$GITHUB_REPOSITORY" -p "$ASSET" -D . \
             && bash "$GITHUB_WORKSPACE/scripts/pwrt-cache.sh" unpack "$CACHE_ROOT" "./$ASSET"; then
            rm -f "./$ASSET"
            echo "restored=true" >> "$GITHUB_OUTPUT"
            echo "✅ 已从 Release 备份恢复: $ASSET"
          else
            rm -f "./$ASSET"
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release 备份恢复失败，走真编译"
          fi

      - name: Prepare restored build cache
        if: >-
          env.IGNORE_CACHE != 'true'
          && (steps.cache-restore.outputs.cache-matched-key != ''
              || steps.release-restore.outputs.restored == 'true')
        env:
          RESTORED_FROM: ${{ steps.cache-restore.outputs.cache-matched-key }}
        run: |
          cd "$CACHE_ROOT"
          echo "actions/cache 恢复自: ${RESTORED_FROM:-（无）}"
          echo "Release 备份恢复: ${{ steps.release-restore.outputs.restored }}"
          bash "$GITHUB_WORKSPACE/scripts/pwrt-cache.sh" prepare "$CACHE_ROOT"

      - name: Update & install feeds
        run: |
          cd "$CACHE_ROOT"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Pull optional plugins (diy-part1.sh)
        continue-on-error: true
        run: |
          cd "$CACHE_ROOT"
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      # =========================================================
      # 用 SoC 通用配置打底（不指定机型）—— 缓存与机型无关，
      # 这里只需要一个「能通过 defconfig 的合法配置」
      # =========================================================
      - name: Load configuration
        run: |
          cd "$CACHE_ROOT"
          if [ -f "configs/${SOC}.config" ]; then
            cp "configs/${SOC}.config" .config
            echo "✅ 使用源码 configs/${SOC}.config"
          elif [ -e "$GITHUB_WORKSPACE/configs/${SOC}.config" ]; then
            cp "$GITHUB_WORKSPACE/configs/${SOC}.config" .config
            echo "✅ 使用仓库内 configs/${SOC}.config"
          else
            echo "::error::找不到 ${SOC}.config"
            exit 1
          fi
          sed -i '/CONFIG_TARGET_DEVICE_/d; /^CONFIG_TARGET_MULTI_PROFILE=/d' .config

      - name: Prepare host toolchain (Go / BPF / Python)
        continue-on-error: true
        run: |
          cd "$CACHE_ROOT"
          S="$GITHUB_WORKSPACE/scripts/prepare-build-host.sh"
          [ -f "$S" ] || { echo "::warning::缺 $S"; exit 0; }
          dos2unix "$S" 2>/dev/null || true
          bash "$S" "$CACHE_ROOT"

      - name: Prepare Rust toolchain (prebuilt)
        continue-on-error: true
        run: |
          cd "$CACHE_ROOT"
          S="$GITHUB_WORKSPACE/scripts/prepare-rust.sh"
          [ -f "$S" ] || { echo "::warning::缺 $S"; exit 0; }
          dos2unix "$S" 2>/dev/null || true
          bash "$S" "$CACHE_ROOT"

      - name: Re-run defconfig
        run: |
          cd "$CACHE_ROOT"
          make defconfig 2>&1 | tail -5
          grep -E 'GOLANG_EXTERNAL_BOOTSTRAP_ROOT|BPF_TOOLCHAIN_HOST' .config || true

      # =========================================================
      # 只有真没命中才编；命中（含前缀回退命中）就整段跳过
      # =========================================================
      - name: Download toolchain sources
        if: >-
          env.IGNORE_CACHE == 'true'
          || (steps.cache-restore.outputs.cache-matched-key == ''
              && steps.release-restore.outputs.restored != 'true')
        run: |
          cd "$CACHE_ROOT"
          for i in 1 2 3; do
            echo "===== 第 $i 次尝试: tools/toolchain download ====="
            make tools/download toolchain/download -j8 && break
            sleep 5
          done
          find dl -size -1024c -type f -exec rm -f {} \; 2>/dev/null || true
          echo "dl 目录共 $(ls -1 dl 2>/dev/null | wc -l) 个文件"

      - name: Build tools & toolchain
        id: toolchain
        if: >-
          env.IGNORE_CACHE == 'true'
          || (steps.cache-restore.outputs.cache-matched-key == ''
              && steps.release-restore.outputs.restored != 'true')
        run: |
          cd "$CACHE_ROOT"
          make tools/install -j"$(nproc)" || make tools/install -j1 V=s || {
            echo "::error::tools 编译失败"; exit 1; }
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s || {
            echo "::error::toolchain 编译失败"; exit 1; }
          touch tools/stamp-compile toolchain/stamp-compile 2>/dev/null || true
          mkdir -p tmp && echo 1 > tmp/.build

      - name: Save build cache
        if: >-
          success()
          && steps.cache-restore.outputs.cache-hit != 'true'
          && steps.toolchain.outcome == 'success'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          key: ${{ steps.cache-key.outputs.key }}
          path: |
            ${{ env.CACHE_ROOT }}/.ccache
            ${{ env.CACHE_ROOT }}/staging_dir/host*
            ${{ env.CACHE_ROOT }}/staging_dir/tool*

      - name: Save cache to Release backup
        if: >-
          env.RELEASE_BACKUP == 'true'
          && success()
          && steps.cache-restore.outputs.cache-hit != 'true'
          && steps.toolchain.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$CACHE_ROOT"
          KEY="${{ steps.cache-key.outputs.key }}"
          PREFIX="${{ steps.cache-key.outputs.prefix }}"
          TARBALL="${KEY}.tzst"

          which zstd >/dev/null 2>&1 || sudo -E apt-get -yqq install zstd >/dev/null 2>&1 || true

          if ! bash "$GITHUB_WORKSPACE/scripts/pwrt-cache.sh" pack "$CACHE_ROOT" "$CACHE_ROOT/$TARBALL"; then
            echo "::warning::打包失败，跳过 Release 备份"; exit 0
          fi

          SZ=$(stat -c%s "$TARBALL")
          if [ "$SZ" -gt 2000000000 ]; then
            echo "::warning::${SZ} 字节超过 2 GiB，跳过备份"; rm -f "$TARBALL"; exit 0
          fi

          gh release view "$CACHE_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$CACHE_RELEASE" --repo "$GITHUB_REPOSITORY" \
              --title "Build Cache Backup" \
              --notes "整体构建缓存的长期备份，由 build-ponwrt / warm-cache 自动维护，请勿手动删除。" \
              --latest=false || true

          gh release upload "$CACHE_RELEASE" "$TARBALL" --repo "$GITHUB_REPOSITORY" --clobber

          gh release view "$CACHE_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[] | "\(.createdAt) \(.name)"' 2>/dev/null \
            | grep " ${PREFIX}-" | awk '{print $2}' | grep -vx "$TARBALL" \
            | while read -r old; do
                echo "删除旧备份: $old"
                gh release delete-asset "$CACHE_RELEASE" "$old" --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true
              done

          rm -f "$TARBALL"

      - name: Cache status
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-reports"
          REPORT_DIR="$GITHUB_WORKSPACE/build-reports" \
            bash "$GITHUB_WORKSPACE/scripts/pwrt-cache.sh" status "$CACHE_ROOT"

      - name: Upload cache report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: warm-cache-${{ matrix.soc }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/build-reports/
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "### Warm Cache — ${{ matrix.soc }}"
            echo ""
            echo "- key: \`${{ steps.cache-key.outputs.key }}\`"
            echo "- actions/cache 命中: ${{ steps.cache-restore.outputs.cache-matched-key || '无' }}"
            echo "- Release 备份恢复: ${{ steps.release-restore.outputs.restored || 'false' }}"
            echo "- 编译工具链: ${{ steps.toolchain.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # 与主流程同一个轮换动作，预热跑完也顺手清一次
  #
  #   ⚠ 单独成 job，不能并进 build：actions/cache/save 是收尾动作，
  #     紧跟着查有时还查不到新 key —— 会误判「没有当前代」而把唯一一份删了。
  cache-rollover:
    name: Roll build cache (${{ matrix.soc }})
    needs: [prepare, build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    concurrency:
      group: ponwrt-cache-rollover-${{ github.ref }}-${{ matrix.soc }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOC: ${{ matrix.soc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Roll cache generations
        continue-on-error: true
        run: |
          S="$GITHUB_WORKSPACE/scripts/pwrt-cache.sh"
          dos2unix "$S" 2>/dev/null || true
          # 只给前缀，不给 KEY：脚本会保留「创建时间最新」的那一代
          PREFIX=$(bash "$S" prefix | sed -n 's/^prefix=//p' | head -1)
          echo "PREFIX=$PREFIX"
          [ -n "$PREFIX" ] || { echo "::warning::算不出前缀，跳过"; exit 0; }
          PREFIX="$PREFIX" KEY='' bash "$S" rollover
